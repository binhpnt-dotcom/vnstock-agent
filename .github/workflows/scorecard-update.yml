name: Update Market Scorecard

on:
  schedule:
    # 00:30 UTC = 07:30 ICT, Mon-Fri (after VN market data settles)
    - cron: "30 0 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install vnstock-agent
        run: pip install -e ".[dev]"

      - name: Update scorecard workbook + dashboard
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          vnstock-agent scorecard update \
            data/scorecard/FO_Market_Scorecard_Polo_OneSheet_v5.xlsx \
            --dashboard docs/scorecard/index.html

      - name: Commit updated scorecard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scorecard docs/scorecard
          git diff --staged --quiet || git commit -m "chore: auto-update market scorecard"
          git push
